<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>ตั้งค่าโปรไฟล์ - Smart Parking</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { background: #f8f9fa; font-family: 'Kanit', sans-serif; }
        .profile-card { background: white; border-radius: 20px; padding: 30px; box-shadow: 0 10px 20px rgba(0,0,0,0.05); max-width: 450px; width: 90%; margin: 30px auto; }
        .img-wrapper { position: relative; width: 110px; height: 110px; margin: 0 auto 15px; }
        .profile-pic { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 4px solid #4361ee; background: #eee; }
        .edit-icon { position: absolute; bottom: 0; right: 0; background: #4361ee; color: white; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 3px solid white; cursor: pointer; }
        .info-box { background: #f1f4ff; border-radius: 12px; padding: 15px; margin-bottom: 20px; border-left: 5px solid #4361ee; }
    </style>
</head>
<body>

<div class="profile-card">
    <h4 class="fw-bold text-center mb-4">ข้อมูลผู้ใช้งาน</h4>
    
    <div class="img-wrapper text-center">
        <img id="preview" src="https://via.placeholder.com/110" class="profile-pic">
        <label for="file-upload" class="edit-icon"><i class="fa-solid fa-camera"></i></label>
        <input type="file" id="file-upload" hidden accept="image/*">
    </div>

    <div class="info-box">
        <p class="small fw-bold text-primary mb-1"><i class="fa-solid fa-square-p me-2"></i>สถานะการจองปัจจุบัน</p>
        <div id="booking-status" class="text-dark fw-bold">กำลังโหลดข้อมูล...</div>
    </div>

    <div class="mb-3">
        <label class="small fw-bold text-muted">อีเมล</label>
        <input type="text" id="email" class="form-control bg-light" readonly disabled style="border-radius:10px;">
    </div>
    
    <div class="mb-3">
        <label class="small fw-bold text-muted">ชื่อแสดงผล</label>
        <input type="text" id="displayName" class="form-control" style="border-radius:10px;" placeholder="ระบุชื่อของคุณ">
    </div>

    <div class="mb-4">
        <label class="small fw-bold text-muted">ทะเบียนรถหลัก</label>
        <input type="text" id="carId" class="form-control" style="border-radius:10px;" placeholder="เช่น กข 1234 กรุงเทพ">
    </div>

    <button id="save-btn" class="btn btn-primary w-100 mb-2" style="border-radius:10px;">บันทึกข้อมูล</button>
    <a href="index.html" class="btn btn-light w-100" style="border-radius:10px;">กลับหน้าหลัก</a>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyCUBzXNuOni3jB8qLXDlbySY69TNcIUuyg",
        authDomain: "smart-parking-iot-fd3c3.firebaseapp.com",
        databaseURL: "https://smart-parking-iot-fd3c3-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "smart-parking-iot-fd3c3",
        storageBucket: "smart-parking-iot-fd3c3.firebasestorage.app",
        messagingSenderId: "128328064605",
        appId: "1:128328064605:web:dabad467fa1cfbf83b77b4"
    };
    firebase.initializeApp(firebaseConfig);

    const auth = firebase.auth();
    const db = firebase.database();
    let selectedFile = null;

    auth.onAuthStateChanged(user => {
        if (!user) {
            window.location.replace("login.html");
            return;
        }
        
        document.getElementById('email').value = user.email;
        document.getElementById('displayName').value = user.displayName || "";
        
        // ดึงข้อมูลจาก Database เป็นหลักเพื่อให้ได้รูปที่ชัดและข้อมูลครบ
        db.ref('users/' + user.uid).on('value', snapshot => {
            if (snapshot.exists()) {
                const data = snapshot.val();
                document.getElementById('carId').value = data.carId || "";
                if (data.photoURL) {
                    document.getElementById('preview').src = data.photoURL;
                } else if (user.photoURL) {
                    document.getElementById('preview').src = user.photoURL;
                }
            }
        });

        // ตรวจสอบสถานะการจอง
        db.ref('parking_slots').on('value', snapshot => {
            let userBooking = "ไม่มีการจองในขณะนี้";
            snapshot.forEach(child => {
                const slot = child.val();
                if (slot.user_email === user.email && slot.status === "booked") {
                    userBooking = `จองอยู่: ช่อง ${child.key.replace('_',' ')} (ทะเบียน: ${slot.car_id})`;
                }
            });
            document.getElementById('booking-status').innerText = userBooking;
        });
    });

    document.getElementById('file-upload').onchange = (e) => {
        const file = e.target.files[0];
        if (file) {
            selectedFile = file;
            const reader = new FileReader();
            reader.onload = (event) => {
                document.getElementById('preview').src = event.target.result;
            };
            reader.readAsDataURL(file);
        }
    };

    // ฟังก์ชันบีบอัดรูปภาพให้เล็กลง (เพื่อป้องกัน Photo URL too long)
    function compressImage(imgElement) {
        return new Promise((resolve) => {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            
            // ปรับขนาดรูปให้เหลือแค่ 120x120 px (พอดีกับรูปวงกลม)
            const size = 120; 
            canvas.width = size;
            canvas.height = size;
            
            ctx.drawImage(imgElement, 0, 0, size, size);
            
            // บีบคุณภาพเหลือ 0.5 (50%) เพื่อให้ String สั้นที่สุด
            resolve(canvas.toDataURL('image/jpeg', 0.5));
        });
    }

    document.getElementById('save-btn').onclick = async () => {
        const user = auth.currentUser;
        const btn = document.getElementById('save-btn');
        const newName = document.getElementById('displayName').value;
        const newCarId = document.getElementById('carId').value;
        const previewImg = document.getElementById('preview');

        if (!newName) { alert("กรุณาระบุชื่อแสดงผล"); return; }

        btn.disabled = true;
        btn.innerText = "กำลังบันทึก...";

        try {
            let finalPhotoURL = user.photoURL;
            
            // ถ้ามีการเลือกรูปใหม่ ให้บีบอัดก่อน
            if (selectedFile || previewImg.src.startsWith('data:image')) {
                finalPhotoURL = await compressImage(previewImg);
            }

            // 1. บันทึกลง Realtime Database (ไม่มีข้อจำกัดความยาว String ที่เข้มงวดเท่า Auth)
            await db.ref('users/' + user.uid).update({
                carId: newCarId,
                displayName: newName,
                email: user.email,
                photoURL: finalPhotoURL,
                lastUpdated: firebase.database.ServerValue.TIMESTAMP
            });

            // 2. บันทึกลง Firebase Auth (ใช้ String ที่บีบอัดแล้ว)
            // ถ้า String ยังยาวไป Auth จะข้ามขั้นตอนนี้ไป แต่รูปใน Database ยังคงอยู่
            try {
                await user.updateProfile({
                    displayName: newName,
                    photoURL: finalPhotoURL
                });
            } catch (authError) {
                console.warn("Auth profile photo update failed, but DB updated.", authError);
            }

            alert("บันทึกข้อมูลเรียบร้อยแล้ว!");
            window.location.href = "index.html"; 
        } catch (error) {
            console.error(error);
            alert("เกิดข้อผิดพลาด: " + error.message);
        } finally {
            btn.disabled = false;
            btn.innerText = "บันทึกข้อมูล";
        }
    };
</script>
</body>
</html>
