<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard - Smart Parking</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body, html { height: 100%; margin: 0; background-color: #f1f5f9; font-family: 'Kanit', sans-serif; }
        .wrapper { display: flex; flex-direction: column; min-height: 100vh; }
        .navbar { height: 65px; background: #1e293b !important; }
        .main-content { flex-grow: 1; padding: 25px; display: flex; flex-direction: column; gap: 25px; }
        .stats-card { background: white; border-radius: 18px; padding: 20px; text-align: center; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); border: none; transition: 0.3s; }
        .stats-card:hover { transform: translateY(-5px); }
        .stats-card h2 { font-size: 2.5rem; margin: 0; font-weight: 700; }
        .dashboard-grid { display: grid; grid-template-columns: 1.2fr 1fr; gap: 25px; }
        .panel { background: white; border-radius: 20px; padding: 25px; box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1); }
        .parking-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .slot-card { border-radius: 15px; border: 1px solid #e2e8f0; padding: 20px; background: #ffffff; transition: 0.2s; }
        .slot-title { font-size: 1.1rem; font-weight: 700; color: #334155; }
        .car-info { height: 60px; display: flex; flex-direction: column; justify-content: center; }
        .car-info b { font-size: 1.1rem; color: #1e293b; }
        @media (max-width: 1200px) { .dashboard-grid { grid-template-columns: 1fr; } }
        @media (max-width: 576px) { .parking-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<div class="wrapper">
    <nav class="navbar navbar-dark shadow-lg">
        <div class="container-fluid px-4">
            <span class="navbar-brand fw-bold"><i class="fa-solid fa-square-p text-info me-2"></i>SMART PARKING ADMIN</span>
            <div class="d-flex align-items-center">
                <div class="dropdown me-3">
                    <button class="btn btn-outline-info btn-sm dropdown-toggle rounded-pill px-3" type="button" data-bs-toggle="dropdown">
                        <i class="fa-solid fa-earth-americas me-1"></i> <span id="current-lang">Language</span>
                    </button>
                    <ul class="dropdown-menu shadow">
                        <li><a class="dropdown-item" href="javascript:void(0)" onclick="changeLang('th')">🇹🇭 ภาษาไทย</a></li>
                        <li><a class="dropdown-item" href="javascript:void(0)" onclick="changeLang('en')">🇺🇸 English</a></li>
                        <li><a class="dropdown-item" href="javascript:void(0)" onclick="changeLang('cn')">🇨🇳 中文</a></li>
                    </ul>
                </div>
                <a href="history.html" id="btn-history" class="btn btn-outline-info btn-sm me-2 rounded-pill px-4 fw-bold">ประวัติการจอง</a>
                <button id="btn-logout" class="btn btn-danger btn-sm rounded-pill px-4 fw-bold" onclick="logout()">LOGOUT</button>
            </div>
        </div>
    </nav>

    <div class="main-content">
        <div class="row g-4">
            <div class="col-md-4">
                <div class="stats-card border-start border-success border-5">
                    <small id="label-available" class="text-success fw-bold text-uppercase">ช่องว่าง</small>
                    <h2 id="stat-available" class="text-success">0</h2>
                </div>
            </div>
            <div class="col-md-4">
                <div class="stats-card border-start border-warning border-5">
                    <small id="label-booked" class="text-warning fw-bold text-uppercase">จองแล้ว</small>
                    <h2 id="stat-booked" class="text-warning">0</h2>
                </div>
            </div>
            <div class="col-md-4">
                <div class="stats-card border-start border-danger border-5">
                    <small id="label-occupied" class="text-danger fw-bold text-uppercase">มีรถจอด</small>
                    <h2 id="stat-occupied" class="text-danger">0</h2>
                </div>
            </div>
        </div>

        <div class="dashboard-grid">
            <div class="panel">
                <h5 class="fw-bold mb-4"><i class="fa-solid fa-chalkboard-user me-2"></i><span id="title-grid">ผังช่องจอด (Real-time)</span></h5>
                <div class="parking-grid" id="admin-container"></div>
            </div>

            <div class="panel">
                <h5 class="fw-bold mb-4"><i class="fa-solid fa-chart-bar me-2"></i><span id="title-chart">สถิติ 7 วันล่าสุด</span></h5>
                <div style="height: 350px; position: relative;">
                    <canvas id="weeklyBarChart"></canvas>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    // Firebase Configuration
    const firebaseConfig = {
        apiKey: "AIzaSyCUBzXNuOni3jB8qLXDlbySY69TNcIUuyg",
        authDomain: "smart-parking-iot-fd3c3.firebaseapp.com",
        databaseURL: "https://smart-parking-iot-fd3c3-default-rtdb.asia-southeast1.firebasedatabase.app/",
        projectId: "smart-parking-iot-fd3c3",
        storageBucket: "smart-parking-iot-fd3c3.firebasestorage.app",
        messagingSenderId: "128328064605",
        appId: "1:128328064605:web:dabad467fa1cfbf83b77b4"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    let barChart;

    // --- Multi-language Logic ---
    const translations = {
        th: {
            history: "ประวัติการจอง", logout: "ออกจากระบบ", available: "ช่องว่าง", booked: "จองแล้ว", occupied: "มีรถจอด",
            gridTitle: "ผังช่องจอด (Real-time)", chartTitle: "สถิติ 7 วันล่าสุด", reset: "รีเซ็ต", checkin: "เช็คอิน",
            carInfo: "ทะเบียนรถ / รหัสจอง:", chartLabel: "ยอดการจอง", days: ["อา.", "จ.", "อ.", "พ.", "พฤ.", "ศ.", "ส."]
        },
        en: {
            history: "History", logout: "Logout", available: "Available", booked: "Booked", occupied: "Occupied",
            gridTitle: "Parking Grid (Real-time)", chartTitle: "Last 7 Days Stats", reset: "RESET", checkin: "CHECK-IN",
            carInfo: "License Plate / Code:", chartLabel: "Total Bookings", days: ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"]
        },
        cn: {
            history: "预订历史", logout: "登出", available: "空置", booked: "已预订", occupied: "已占用",
            gridTitle: "车位图 (实时)", chartTitle: "最近7天统计", reset: "重置", checkin: "登记",
            carInfo: "车牌号 / 预订代码:", chartLabel: "总预订量", days: ["日", "一", "二", "三", "四", "五", "六"]
        }
    };

    function changeLang(lang) {
        localStorage.setItem('selectedLang', lang);
        const t = translations[lang];
        document.getElementById('current-lang').innerText = lang.toUpperCase();
        document.getElementById('btn-history').innerText = t.history;
        document.getElementById('btn-logout').innerText = t.logout;
        document.getElementById('label-available').innerText = t.available;
        document.getElementById('label-booked').innerText = t.booked;
        document.getElementById('label-occupied').innerText = t.occupied;
        document.getElementById('title-grid').innerText = t.gridTitle;
        document.getElementById('title-chart').innerText = t.chartTitle;
        
        // Refresh UI components that depend on language
        refreshGrid();
        refreshChart();
    }

    // 1. Listen for Real-time Slot Updates
    function refreshGrid() {
        const lang = localStorage.getItem('selectedLang') || 'th';
        const t = translations[lang];

        db.ref('parking_slots').once('value', (snapshot) => {
            const slots = snapshot.val();
            const container = document.getElementById('admin-container');
            container.innerHTML = "";
            let cAvail = 0, cBook = 0, cOccu = 0;
            const slotKeys = ['slot_01', 'slot_02', 'slot_03', 'slot_04'];

            slotKeys.forEach(key => {
                const data = (slots && slots[key]) ? slots[key] : { status: 'available' };
                let badgeClass = "bg-success";
                let status = data.status || 'available';
                let displayStatus = t[status] || status;

                if (status === 'available') cAvail++;
                else if (status === 'booked') { cBook++; badgeClass = "bg-warning text-dark"; }
                else if (status === 'occupied') { cOccu++; badgeClass = "bg-danger"; }

                container.innerHTML += `
                    <div class="slot-card shadow-sm">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <span class="slot-title text-uppercase">${key.replace('_', ' ')}</span>
                            <span class="badge ${badgeClass} px-3 py-2 rounded-pill">${displayStatus.toUpperCase()}</span>
                        </div>
                        <div class="car-info mb-3">
                            <small class="text-muted">${t.carInfo}</small>
                            <b>${data.car_id || data.booking_code || '---'}</b>
                        </div>
                        <div class="row g-2">
                            <div class="col-6"><button onclick="updateStatus('${key}', 'available')" class="btn btn-outline-secondary btn-sm w-100">${t.reset}</button></div>
                            <div class="col-6"><button onclick="updateStatus('${key}', 'occupied')" class="btn btn-danger btn-sm w-100">${t.checkin}</button></div>
                        </div>
                    </div>`;
            });
            document.getElementById('stat-available').innerText = cAvail;
            document.getElementById('stat-booked').innerText = cBook;
            document.getElementById('stat-occupied').innerText = cOccu;
        });
    }

    // Keep grid updated in real-time
    db.ref('parking_slots').on('value', refreshGrid);

    // 2. Statistics Chart logic
    function refreshChart() {
        const lang = localStorage.getItem('selectedLang') || 'th';
        const t = translations[lang];

        db.ref('booking_history').once('value', (snapshot) => {
            const historyData = snapshot.val();
            const dayLabels = [];
            const dayValues = [];
            const dayMap = t.days;

            for (let i = 6; i >= 0; i--) {
                const d = new Date();
                d.setDate(d.getDate() - i);
                const dd = d.getDate();
                const mm = d.getMonth() + 1;
                const yCE = d.getFullYear();
                const yBE = yCE + 543;

                const formats = [
                    `${yCE}-${mm.toString().padStart(2, '0')}-${dd.toString().padStart(2, '0')}`,
                    `${dd}/${mm}/${yBE}`,
                    `${dd}/${mm}/${yCE}`,
                    `${dd.toString().padStart(2, '0')}/${mm.toString().padStart(2, '0')}/${yBE}`
                ];

                dayLabels.push(`${dd} ${dayMap[d.getDay()]}`);
                let count = 0;
                if (historyData) {
                    Object.values(historyData).forEach(item => {
                        if (item.date && formats.includes(item.date.trim())) count++;
                    });
                }
                dayValues.push(count);
            }
            renderChart(dayLabels, dayValues, t.chartLabel);
        });
    }

    db.ref('booking_history').on('value', refreshChart);

    function renderChart(labels, values, labelTitle) {
        const ctx = document.getElementById('weeklyBarChart').getContext('2d');
        if (barChart) barChart.destroy();
        barChart = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: labels,
                datasets: [{
                    label: labelTitle,
                    data: values,
                    backgroundColor: values.map((v, i) => i === 6 ? '#3b82f6' : '#e2e8f0'),
                    borderRadius: 8
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: { 
                    y: { beginAtZero: true, ticks: { stepSize: 1, color: '#64748b' }, grid: { color: '#f1f5f9' } },
                    x: { ticks: { color: '#64748b' }, grid: { display: false } }
                },
                plugins: { legend: { display: false } }
            }
        });
    }

    // 3. Update Status and Clear Data
    function updateStatus(id, stat) {
        const val = { status: stat };
        if (stat === 'available') {
            val.user_email = ""; 
            val.booking_code = ""; 
            val.car_id = ""; 
            val.arrive_within = ""; 
        }
        db.ref('parking_slots/' + id).update(val);
    }

    function logout() { 
        firebase.auth().signOut().then(() => { window.location.href = "login.html"; }); 
    }

    // Initialization
    $(document).ready(function () {
        const savedLang = localStorage.getItem('selectedLang') || 'th';
        changeLang(savedLang);
    });

    // Admin Auth Check
    firebase.auth().onAuthStateChanged(user => {
        if (!user || user.email !== "admin@gmail.com") {
            window.location.href = "login.html";
        }
    });
</script>
</body>
</html>
